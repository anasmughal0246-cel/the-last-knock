<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — The Last Knock</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
</head>
<body>
  <div class="flicker-overlay"></div>

  <div class="auth-page">
    <!-- Left side: horror image -->
    <div class="auth-image-side">
      <div class="auth-image-overlay"></div>
      <div class="auth-image-content">
        <h1 class="auth-brand">The Last Knock</h1>
        <p class="auth-brand-sub">"Not all doors should be opened."</p>
        <div class="auth-poster-tags">
          <span>🩸 17 Chapters</span>
          <span>💀 4 Endings</span>
          <span>🏆 Achievements</span>
        </div>
      </div>
    </div>

    <!-- Right side: form -->
    <div class="auth-form-side">
      <div class="auth-form-box">
        <div class="auth-form-header">
          <h2 class="auth-title">Welcome Back</h2>
          <p class="auth-subtitle">The darkness has been waiting...</p>
        </div>

        <div id="login-alert"></div>

        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="email" placeholder="your@email.com" autocomplete="email"/>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
        </div>

        <button class="auth-btn" id="login-btn">Enter the Dark</button>

        <p class="auth-switch">
          New here? <a href="register.html">Create your story</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (localStorage.getItem('token')) window.location.href = '/dashboard.html';

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertEl  = document.getElementById('login-alert');
      alertEl.innerHTML = '';

      if (!email || !password) {
        alertEl.innerHTML = '<div class="auth-alert error">Please fill in all fields</div>';
        return;
      }

      const btn = document.getElementById('login-btn');
      btn.textContent = 'Entering...';
      btn.disabled = true;

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertEl.innerHTML = `<div class="auth-alert error">${err.message}</div>`;
        btn.textContent = 'Enter the Dark';
        btn.disabled = false;
      }
    });

    document.getElementById('password').addEventListener('keypress', e => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
  </script>
</body>
</html>

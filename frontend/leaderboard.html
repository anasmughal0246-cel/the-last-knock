<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leaderboard — The Last Knock</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/leaderboard.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
</head>
<body>
  <div class="flicker-overlay"></div>

  <header class="dash-header">
    <h1 class="dash-logo">The Last Knock</h1>
    <nav class="dash-nav">
      <a href="dashboard.html">&#127968; Dashboard</a>
      <a href="story.html">&#9654; Play</a>
      <a href="achievements.html">&#127942; Achievements</a>
      <a href="profile.html">&#128100; Profile</a>
      <a href="settings.html">&#9881; Settings</a>
      <button class="btn-sm" id="logout-btn">Logout</button>
    </nav>
  </header>

  <main class="lb-main">
    <h2 class="lb-title">Leaderboard</h2>
    <p class="lb-subtitle">Your rank among the survivors</p>

    <div class="lb-table-wrap">
      <table class="lb-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Survivor</th>
            <th>Score</th>
            <th>Games</th>
          </tr>
        </thead>
        <tbody id="lb-body">
          <tr>
            <td colspan="4" style="text-align:center;padding:40px">
              <div class="spinner"></div>
              <div style="color:#888;font-family:'Share Tech Mono',monospace;font-size:13px;margin-top:12px">
                Loading your stats...
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/leaderboard.js"></script>
  <script>
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/index.html';
    });
  </script>
</body>
</html>

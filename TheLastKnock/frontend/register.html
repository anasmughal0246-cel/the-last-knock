<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — The Last Knock</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/auth.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
</head>
<body>
  <div class="flicker-overlay"></div>
  <div class="auth-container">
    <div class="auth-card fade-in-up">
      <div class="auth-header">
        <h1 class="auth-logo">The Last Knock</h1>
        <p class="auth-subtitle">Create your survivor profile</p>
      </div>
      <div id="alert-box"></div>
      <form id="register-form">
        <div class="form-group">
          <label for="username">Survivor Name</label>
          <input type="text" id="username" placeholder="Enter your name..." autocomplete="off"/>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com"/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min. 6 characters"/>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Repeat password"/>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="register-btn">
          Begin the Story
        </button>
      </form>
      <p class="auth-switch">
        Already a survivor? <a href="login.html">Enter here</a>
      </p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
